<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paco Roleplay - Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="background">
        <video id="background-video" autoplay muted loop>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>
    <audio id="music-player" loop preload="auto"></audio>

    <div class="content">
        <div class="server-info">
            <div class="server-name">
                <h1>PACO</h1>
                <h2>ROLEPLAY</h2>
            </div>
            <p class="server-description">Bu LoadingScreen ModradiaaS Tarafından geliştirilmiştir Lütfen Paylaşmadan Önce bildiriniz</p>
            
            <div class="social-icons">
                <a href="#" class="social-icon"><i class="fab fa-discord"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-twitch"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            </div>
        </div>

        <div class="music-controls">
            <div class="music-info">
                <span id="music-title">Loading music...</span>
            </div>
            <div class="music-buttons">
                <button id="play-pause-btn" class="music-btn">
                    <i class="fas fa-pause"></i>
                </button>
                <div class="volume-control">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volume-slider" min="0" max="100" value="70">
                </div>
                <button id="music-settings-btn" class="music-btn">
                    <i class="fas fa-music"></i>
                </button>
            </div>
        </div>

        <div id="music-settings-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>Music Settings</h3>
                <div class="music-selection">
                    <p>Select from default tracks:</p>
                    <select id="default-music-select">
                        <option value="">-- Select a track --</option>
                        <option value="music/track1.mp3">Paco Vibes</option>
                        <option value="music/track2.mp3">City Lights</option>
                        <option value="music/track3.mp3">Night Drive</option>
                        <option value="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Tours/Enthusiast/Tours_-_01_-_Enthusiast.mp3">Enthusiast by Tours</option>
                        <option value="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Satin/Kai_Engel_-_07_-_Interception.mp3">Interception by Kai Engel</option>
                        <option value="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Chad_Crouch/Arps/Chad_Crouch_-_Shipping_Lanes.mp3">Shipping Lanes by Chad Crouch</option>
                    </select>
                    <p>Or enter a custom URL:</p>
                    <input type="text" id="custom-music-url" placeholder="https://example.com/music.mp3">
                    <button id="set-music-btn">Set Music</button>
                </div>
            </div>
        </div>

        <div class="lists-container">
            <div class="staff-list">
                <h3>Staff Team</h3>
                <ul id="staff-list">
                    <li>
                        <span class="lightning"><i class="fas fa-bolt"></i></span>
                        <span class="name">ModradiaaS</span>
                        <span class="role">Owner</span>
                    </li>
                </ul>
            </div>

    <div class="loading-bar-container">
        <div class="loading-bar"></div>
        <div class="loading-percentage">0%</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
